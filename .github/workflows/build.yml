          import android.widget.RadioButton
          import android.widget.RadioGroup
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat
          import com.swordfish.libretrodroid.GLRetroView
          import com.swordfish.libretrodroid.GLRetroViewData
          import com.swordfish.libretrodroid.Variable
          import kotlinx.coroutines.runBlocking
          import java.io.File
          import java.io.FileInputStream
          import java.security.MessageDigest
          import java.util.concurrent.Executors
          import kotlin.math.abs
          import kotlin.math.hypot

          // El valor lo pone el workflow desde DISC_FOLDER (arriba en build.yml).
          const val DISC_FOLDER = "__DISC_FOLDER__"

          // SHA-256 de los discos permitidos (los nombres de archivo no importan)
          const val HASH_USA_BIN = "06084490ea0db34099b31495ccba4ec18fb0ff25c7683c508e9d2db93d4495f4"
          const val HASH_USA_CUE = "82b297b9b499fea9c7f361a497b933b7f971394148212eca03e4798ddc0c98d1"
          const val HASH_JP_ISO = "b5ff9ed251bced70c20eb911eab8ac3e5b77d7a140983d3b5dc31decac4837af"
          const val CORE_LIB = "libpcsx_rearmed_libretro_android.so"

          // Valores predeterminados de los ajustes
          const val RES_DEFECTO = 1   // 1x
          const val TAM_DEFECTO = 100 // % tamaño de controles
          const val OPA_DEFECTO = 30  // % opacidad de controles
          const val IDIOMA_DEFECTO = "en" // "en" = inglés, "es" = español
          const val JOY_ID = 1000 // clave donde se guarda la posición del joystick

          class Ajustes(ctx: Context) {
              private val p = ctx.getSharedPreferences("ajustes", Context.MODE_PRIVATE)

              var resolucion: Int
                  get() = p.getInt("res", RES_DEFECTO)
                  set(v) { p.edit().putInt("res", v).apply() }

              var tamano: Int
                  get() = p.getInt("tam", TAM_DEFECTO)
                  set(v) { p.edit().putInt("tam", v).apply() }

              var opacidad: Int
                  get() = p.getInt("opa", OPA_DEFECTO)
                  set(v) { p.edit().putInt("opa", v).apply() }

              var idioma: String
                  get() = p.getString("idioma", IDIOMA_DEFECTO) ?: IDIOMA_DEFECTO
                  set(v) { p.edit().putString("idioma", v).apply() }

              var modoGamepad: Boolean
                  get() = p.getBoolean("gamepad", false)
                  set(v) { p.edit().putBoolean("gamepad", v).apply() }

              fun dx(id: Int): Int = p.getInt("dx" + id, 0)
              fun dy(id: Int): Int = p.getInt("dy" + id, 0)
              fun mover(id: Int, dx: Int, dy: Int) {
                  p.edit().putInt("dx" + id, dx).putInt("dy" + id, dy).apply()
              }

              // Restablece resolución y controles. El idioma y el modo gamepad se conservan.
              fun restablecer() {
                  val actual = idioma
                  val gp = modoGamepad
                  p.edit().clear().putString("idioma", actual).putBoolean("gamepad", gp).apply()
              }
          }

          class PadButton(
              context: Context,
              private val label: String,
              val keyCode: Int,
              private val ajustes: Ajustes,
              private val send: (Int, Int) -> Unit,
              private val round: Boolean,
              private val hit: Float,
              private val iconRes: Int = 0
          ) : View(context) {
              var editMode = false
              // Icono opcional: si existe se dibuja en lugar del texto
              private val icono: Bitmap? =
                  if (iconRes != 0) BitmapFactory.decodeResource(context.resources, iconRes) else null
              private val iconPaint = Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG)
              private val fill = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.WHITE }
              private val text = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE
                  textAlign = Paint.Align.CENTER
              }
              private val borde = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.YELLOW
                  style = Paint.Style.STROKE
                  strokeWidth = 4f
              }
              private var down = false
              private var ox = 0f
              private var oy = 0f
              private var tx0 = 0f
              private var ty0 = 0f

              // Pulsa o suelta el botón (lo llama la capa de controles)
              fun presionar(estado: Boolean) {
                  if (down == estado) return
                  down = estado
                  send(if (estado) KeyEvent.ACTION_DOWN else KeyEvent.ACTION_UP, keyCode)
                  invalidate()
              }

              // ¿El punto (x, y), en coordenadas de la capa, cae sobre este botón?
              fun contiene(x: Float, y: Float): Boolean {
                  val cx = left + translationX + width / 2f
                  val cy = top + translationY + height / 2f
                  if (round) {
                      val r = minOf(width, height) / 2f * hit
                      val dx = x - cx
                      val dy = y - cy
                      return dx * dx + dy * dy <= r * r
                  }
                  return abs(x - cx) <= width / 2f && abs(y - cy) <= height / 2f
              }

              override fun onDraw(c: Canvas) {
                  val base = ajustes.opacidad * 255 / 100
                  fill.alpha = if (down) minOf(255, base + 100) else base
                  text.alpha = minOf(255, base + 120)
                  text.textSize = 18f * resources.displayMetrics.density * ajustes.tamano / 100f
                  val w = width.toFloat()
                  val h = height.toFloat()
                  if (round) {
                      c.drawCircle(w / 2, h / 2, minOf(w, h) / 2 - 3f, fill)
                      if (editMode) c.drawCircle(w / 2, h / 2, minOf(w, h) / 2 - 3f, borde)
                  } else {
                      c.drawRoundRect(3f, 3f, w - 3f, h - 3f, h / 2, h / 2, fill)
                      if (editMode) c.drawRoundRect(3f, 3f, w - 3f, h - 3f, h / 2, h / 2, borde)
                  }
                  if (icono != null) {
                      val lado = minOf(w, h) * (if (round) 0.8f else 0.92f)
                      val dst = RectF(w / 2 - lado / 2, h / 2 - lado / 2, w / 2 + lado / 2, h / 2 + lado / 2)
                      iconPaint.alpha = if (down) 255 else minOf(255, base + 120)
                      c.drawBitmap(icono, null, dst, iconPaint)
                  } else {
                      c.drawText(label, w / 2, h / 2 - (text.ascent() + text.descent()) / 2, text)
                  }
              }

              // Solo se usa en modo edición (arrastrar). En juego los toques los gestiona CapaControles.
              override fun onTouchEvent(e: MotionEvent): Boolean {
                  if (!editMode) return false
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          ox = e.rawX
                          oy = e.rawY
                          tx0 = translationX
                          ty0 = translationY
                      }
                      MotionEvent.ACTION_MOVE -> {
                          var nx = tx0 + (e.rawX - ox)
                          var ny = ty0 + (e.rawY - oy)
                          val pv = parent as? View
                          if (pv != null) {
                              nx = nx.coerceIn(-left.toFloat(), (pv.width - width - left).toFloat())
                              ny = ny.coerceIn(-top.toFloat(), (pv.height - height - top).toFloat())
                          }
                          translationX = nx
                          translationY = ny
                      }
                      MotionEvent.ACTION_UP -> {
                          val d = resources.displayMetrics.density
                          ajustes.mover(keyCode, (translationX / d).toInt(), (translationY / d).toInt())
                      }
                  }
                  return true
              }
          }

          // Joystick virtual: reemplaza la cruceta. Al moverlo pulsa las flechas del pad
          // (arriba, abajo, izquierda, derecha); en diagonal pulsa dos a la vez.
          class Joystick(
              context: Context,
              private val clave: Int,
              private val ajustes: Ajustes,
              private val send: (Int, Int) -> Unit
          ) : View(context) {
              var editMode = false
              private val fondo = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.WHITE }
              private val aro = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE
                  style = Paint.Style.STROKE
                  strokeWidth = 3f
              }
              private val palo = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.WHITE }
              private val borde = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.YELLOW
                  style = Paint.Style.STROKE
                  strokeWidth = 4f
              }
              private var px = 0f // desplazamiento del palo respecto al centro
              private var py = 0f
              private var arriba = false
              private var abajo = false
              private var izq = false
              private var der = false
              private var ox = 0f
              private var oy = 0f
              private var tx0 = 0f
              private var ty0 = 0f

              private fun centroX(): Float = left + translationX + width / 2f
              private fun centroY(): Float = top + translationY + height / 2f

              // ¿El punto (x, y), en coordenadas de la capa, cae sobre el joystick?
              fun contiene(x: Float, y: Float): Boolean {
                  val r = minOf(width, height) / 2f * 1.2f
                  val dx = x - centroX()
                  val dy = y - centroY()
                  return dx * dx + dy * dy <= r * r
              }

              // Mueve el palo hacia el punto (x, y) y pulsa las flechas que correspondan
              fun mover(x: Float, y: Float) {
                  val radio = minOf(width, height) / 2f
                  var dx = x - centroX()
                  var dy = y - centroY()
                  val dist = hypot(dx, dy)
                  val maximo = radio * 0.6f
                  if (dist > maximo) {
                      dx = dx * maximo / dist
                      dy = dy * maximo / dist
                  }
                  px = dx
                  py = dy
                  val umbral = radio * 0.22f
                  aplicar(dy < -umbral, dy > umbral, dx < -umbral, dx > umbral)
                  invalidate()
              }

              // Suelta el palo: vuelve al centro y suelta todas las flechas
              fun soltar() {
                  px = 0f
                  py = 0f
                  aplicar(false, false, false, false)
                  invalidate()
              }

              private fun aplicar(u: Boolean, d: Boolean, l: Boolean, r: Boolean) {
                  if (u != arriba) {
                      arriba = u
                      send(if (u) KeyEvent.ACTION_DOWN else KeyEvent.ACTION_UP, KeyEvent.KEYCODE_DPAD_UP)
                  }
                  if (d != abajo) {
                      abajo = d
                      send(if (d) KeyEvent.ACTION_DOWN else KeyEvent.ACTION_UP, KeyEvent.KEYCODE_DPAD_DOWN)
                  }
                  if (l != izq) {
                      izq = l
                      send(if (l) KeyEvent.ACTION_DOWN else KeyEvent.ACTION_UP, KeyEvent.KEYCODE_DPAD_LEFT)
                  }
                  if (r != der) {
                      der = r
                      send(if (r) KeyEvent.ACTION_DOWN else KeyEvent.ACTION_UP, KeyEvent.KEYCODE_DPAD_RIGHT)
                  }
              }

              override fun onDraw(c: Canvas) {
                  val a = ajustes.opacidad * 255 / 100
                  val cx = width / 2f
                  val cy = height / 2f
                  val radio = minOf(width, height) / 2f
                  fondo.alpha = a * 2 / 3
                  aro.alpha = minOf(255, a + 90)
                  palo.alpha = minOf(255, a + 110 + (if (px != 0f || py != 0f) 40 else 0))
                  c.drawCircle(cx, cy, radio - 3f, fondo)
                  c.drawCircle(cx, cy, radio - 3f, aro)
                  c.drawCircle(cx + px, cy + py, radio * 0.38f, palo)
                  if (editMode) c.drawCircle(cx, cy, radio - 3f, borde)
              }

              // Solo se usa en modo edición (arrastrar). En juego los toques los gestiona CapaControles.
              override fun onTouchEvent(e: MotionEvent): Boolean {
                  if (!editMode) return false
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          ox = e.rawX
                          oy = e.rawY
                          tx0 = translationX
                          ty0 = translationY
                      }
                      MotionEvent.ACTION_MOVE -> {
                          var nx = tx0 + (e.rawX - ox)
                          var ny = ty0 + (e.rawY - oy)
                          val pv = parent as? View
                          if (pv != null) {
                              nx = nx.coerceIn(-left.toFloat(), (pv.width - width - left).toFloat())
                              ny = ny.coerceIn(-top.toFloat(), (pv.height - height - top).toFloat())
                          }
                          translationX = nx
                          translationY = ny
                      }
                      MotionEvent.ACTION_UP -> {
                          val d = resources.displayMetrics.density
                          ajustes.mover(clave, (translationX / d).toInt(), (translationY / d).toInt())
                      }
                  }
                  return true
              }
          }
          // Capa que sigue cada dedo: al deslizar de un botón a otro suelta el anterior y pulsa el nuevo.
          // Un mismo dedo puede pulsar dos botones a la vez si toca donde se solapan (diagonales).
          class CapaControles(context: Context) : FrameLayout(context) {
              var joystick: Joystick? = null
              private var punteroJoystick = -1
              var edicion: Boolean = false
                  set(v) {
                      if (v) soltarTodos()
                      field = v
                  }
              private val punteros = HashMap<Int, Set<PadButton>>()
              private val conteo = HashMap<PadButton, Int>()

              override fun dispatchTouchEvent(ev: MotionEvent): Boolean {
                  if (edicion) return super.dispatchTouchEvent(ev)
                  when (ev.actionMasked) {
                      MotionEvent.ACTION_DOWN, MotionEvent.ACTION_POINTER_DOWN -> {
                          val i = ev.actionIndex
                          tocar(ev.getPointerId(i), ev.getX(i), ev.getY(i), true)
                      }
                      MotionEvent.ACTION_MOVE -> {
                          for (i in 0 until ev.pointerCount) {
                              tocar(ev.getPointerId(i), ev.getX(i), ev.getY(i), false)
                          }
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_POINTER_UP -> {
                          soltarPuntero(ev.getPointerId(ev.actionIndex))
                      }
                      MotionEvent.ACTION_CANCEL -> soltarTodos()
                  }
                  return true
              }

              // Un dedo que empieza sobre el joystick lo controla hasta que se suelta; el resto va a los botones.
              private fun tocar(id: Int, x: Float, y: Float, inicio: Boolean) {
                  val j = joystick
                  if (j != null) {
                      if (id == punteroJoystick) {
                          j.mover(x, y)
                          return
                      }
                      if (inicio && punteroJoystick == -1 && j.contiene(x, y)) {
                          punteroJoystick = id
                          performHapticFeedback(HapticFeedbackConstants.VIRTUAL_KEY)
                          j.mover(x, y)
                          return
                      }
                  }
                  actualizar(id, x, y, inicio)
              }

              private fun soltarPuntero(id: Int) {
                  if (id == punteroJoystick) {
                      punteroJoystick = -1
                      joystick?.soltar()
                  } else {
                      soltar(id)
                  }
              }
              private fun actualizar(id: Int, x: Float, y: Float, tactil: Boolean) {
                  val nuevos = HashSet<PadButton>()
                  for (i in 0 until childCount) {
                      val b = getChildAt(i) as? PadButton ?: continue
                      if (b.contiene(x, y)) nuevos.add(b)
                  }
                  val antes: Set<PadButton> = punteros[id] ?: emptySet()
                  for (b in antes) {
                      if (b !in nuevos) quitar(b)
                  }
                  for (b in nuevos) {
                      if (b !in antes) poner(b, tactil)
                  }
                  punteros[id] = nuevos
              }

              private fun poner(b: PadButton, haptico: Boolean) {
                  val n = (conteo[b] ?: 0) + 1
                  conteo[b] = n
                  if (n == 1) {
                      if (haptico) performHapticFeedback(HapticFeedbackConstants.VIRTUAL_KEY)
                      b.presionar(true)
                  }
              }

              private fun quitar(b: PadButton) {
                  val n = (conteo[b] ?: 1) - 1
                  if (n <= 0) {
                      conteo.remove(b)
                      b.presionar(false)
                  } else {
                      conteo[b] = n
                  }
              }

              private fun soltar(id: Int) {
                  val antes = punteros.remove(id) ?: return
                  for (b in antes) quitar(b)
              }

              fun soltarTodos() {
                  for (b in conteo.keys.toList()) b.presionar(false)
                  conteo.clear()
                  punteros.clear()
                  punteroJoystick = -1
                  joystick?.soltar()
              }
          }

          private class Def(
              val label: String, val key: Int, val w: Int, val h: Int, val g: Int,
              val l: Int, val t: Int, val r: Int, val b: Int, val round: Boolean, val hit: Float, val icon: Int = 0
          )

          // Posición predeterminada de cada botón (en dp, a 100 % de tamaño).
          // La cruceta fue reemplazada por el Joystick (clase Joystick, más arriba).
          private fun definiciones(): List<Def> {
              val ia = Gravity.LEFT or Gravity.BOTTOM
              val da = Gravity.RIGHT or Gravity.BOTTOM
              val iar = Gravity.LEFT or Gravity.TOP
              val dar = Gravity.RIGHT or Gravity.TOP
              val ca = Gravity.CENTER_HORIZONTAL or Gravity.BOTTOM
              return listOf(
                  // Acción (por posición: A=abajo=Cruz, B=derecha=Círculo)
                  Def("△", KeyEvent.KEYCODE_BUTTON_Y, 56, 56, da, 0, 0, 62, 138, true, 1f, R.drawable.ic_especial2),
                  Def("✕", KeyEvent.KEYCODE_BUTTON_A, 56, 56, da, 0, 0, 62, 26, true, 1f, R.drawable.ic_salto),
                  Def("□", KeyEvent.KEYCODE_BUTTON_X, 56, 56, da, 0, 0, 118, 82, true, 1f, R.drawable.ic_ataque),
                  Def("○", KeyEvent.KEYCODE_BUTTON_B, 56, 56, da, 0, 0, 6, 82, true, 1f, R.drawable.ic_especial1),
                  // Gatillos
                  Def("L2", KeyEvent.KEYCODE_BUTTON_L2, 64, 40, iar, 16, 16, 0, 0, false, 1f, R.drawable.ic_digievolucion),
                  Def("L1", KeyEvent.KEYCODE_BUTTON_L1, 64, 40, iar, 16, 64, 0, 0, false, 1f, R.drawable.ic_defensa),
                  Def("R2", KeyEvent.KEYCODE_BUTTON_R2, 64, 40, dar, 0, 16, 16, 0, false, 1f),
                  Def("R1", KeyEvent.KEYCODE_BUTTON_R1, 64, 40, dar, 0, 64, 16, 0, false, 1f),
                  // Select / Start
                  Def("SELECT", KeyEvent.KEYCODE_BUTTON_SELECT, 84, 34, ca, -100, 0, 0, 14, false, 1f),
                  Def("START", KeyEvent.KEYCODE_BUTTON_START, 84, 34, ca, 100, 0, 0, 14, false, 1f)
              )
          }

