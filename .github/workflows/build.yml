# Digimon World - APK con emulador de PS1 incluido (LibretroDroid + PCSX ReARMed)
# Guarda este archivo en tu repositorio como: .github/workflows/build.yml
# Luego: pestaña Actions > "Build Digimon World APK" > Run workflow.
# El APK aparece en Releases (y como artefacto de la ejecución).
name: Build Digimon World APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  # ===================== CONFIGURACIÓN (todo fijo aquí) =====================
  # Carpeta donde pones tu disco (sin comillas dobles dentro).
  # Los nombres de archivo NO importan, pero deben ser copias exactas (se verifica el SHA-256):
  #   Digimon World (USA):   .bin + .cue (los dos, en esta carpeta)
  #   Digimon World (Japan): .iso
  DISC_FOLDER: "/storage/emulated/0/Games"
  # Versión de la app: 1.0, 1.1, 1.2, ... (cámbiala en cada actualización)
  APP_VERSION: "1.0"
  # =========================================================================

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generar proyecto Android
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          mkdir -p p/app/src/main/java/org/elpollopaco/digimonworld p/app/src/main/jniLibs/arm64-v8a p/app/src/main/res/drawable
          cd p

          # Iconos de los botones (PNG incrustados en base64)
          mkdir -p app/src/main/res/drawable-nodpi
